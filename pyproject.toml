[project]
name = "algae"
version = "0.4.2"
description = "algae is an AI agent integrated into Discord."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alive-progress>=3.3.0",
    "apscheduler<4",
    "ddgs>=9.11.4",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pydantic-ai>=2.38.0",
    "pydantic-ai-harness[prompt-injection-defender]>=0.30.0",
    "pydantic-ai-slim[web-fetch]>=2.38.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.37",
    "typer>=0.24.1",
]

[project.scripts]
algae = "algae.main:app"
